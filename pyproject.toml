[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-powered-knowledge-base"
version = "0.1.0"
description = "RAG knowledge base with LlamaIndex, FAISS, LangChain, hybrid search, and knowledge graphs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zaheer Ahmed" }]
dependencies = [
  "llama-index>=0.12.0",
  "llama-index-vector-stores-faiss>=0.3.0",
  "llama-index-embeddings-openai>=0.3.0",
  "llama-index-llms-openai>=0.3.0",
  "faiss-cpu>=1.8.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-community>=0.3.0",
  "rank-bm25>=0.2.2",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "cachetools>=5.5.0",
  "networkx>=3.4",
  "python-dotenv>=1.0.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.28"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
